<canvas id="c"></canvas>
<script src="../v6/js/data.js"></script><script src="../v6/js/gl.js"></script><script src="../v6/js/world.js"></script><script src="../v6/js/models.js"></script><script src="../v6/js/rider.js"></script>
<script>
window.ready = (async () => {
  const c = document.getElementById('c'); c.width = innerWidth; c.height = innerHeight; GLR.init(c, { shadow: 2048 });
  const q = new URLSearchParams(location.search); MODEL_FILES.length = 0; (q.get('files') || 'models/rider.glb').split(',').forEach(f => MODEL_FILES.push(f));
  await loadModels('../v6/'); applyTemplates && 0;
  const names = (q.get('tpl') || 'rider').split(','), mb = new MB(); names.forEach((n, i) => stampM(mb, n, M4.trs((i - (names.length - 1) / 2) * 1.2, 0, 0), null, null));

  return Object.keys(TPL).length;
})();
</script>
