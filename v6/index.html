        <p class="fp-hint" data-i18n="skipHint"></p>
      </div>
    </div>
  </section>

  <!-- ============ CONDUITE ============ -->
  <section id="ride" class="view" hidden aria-label="Exploration">
        <div class="hud-top">
      <div class="loc" id="loc"><span class="loc-world" id="locWorld"></span><span class="loc-city" id="locCity"></span></div>
      <nav class="top-actions">
        <button class="chip sound-btn" data-action="sound" id="soundBtn" aria-pressed="false"><span data-i18n="sound"></span> <span class="sound-state" id="soundState">○</span></button>
        <button class="chip" data-action="lang"><span data-i18n="lang"></span></button>
        <button class="chip" data-action="classic"><span data-i18n="classic"></span></button>
        <button class="chip chip-solid" data-action="airport">✈ <span data-i18n="toAirport"></span></button>
      </nav>
    </div>
    <div class="banner" id="banner" aria-live="polite"><small id="bannerKicker"></small><strong id="bannerTitle"></strong></div>
    <div class="mm-wrap"><svg class="minimap" id="minimap" viewBox="-186 -135 372 275" aria-label="Carte"></svg><p class="mm-hint" data-i18n="mapHint"></p></div>
    <div class="fly-bubble" id="flyBubble" aria-live="polite"></div>
    <div class="speedo"><b id="speed">0</b><small data-i18n="kmh"></small></div>
    <p class="controls-hint" id="controlsHint" data-i18n="controls"></p>
    <div class="exit-prompt" id="exitPrompt" hidden>
      <span id="promptText"></span>
      <button class="chip chip-solid" data-action="shortcut" id="promptBtn">✈ <span data-i18n="shortcutBtn"></span> <kbd data-i18n="exitKey"></kbd></button>
    </div>
    <div class="hub" id="hub" hidden>
      <div class="hub-card">
        <p class="kicker" data-i18n="hubTitle"></p>
        <p class="hub-lead" data-i18n="hubLead"></p>
        <div class="hub-rows" id="hubRows"></div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite" hidden></aside>
    <div class="touch" aria-hidden="true">
      <div class="pad"><button data-key="left">◀</button><button data-key="right">▶</button></div>
      <div class="pad"><button data-key="down">▼</button><button data-key="up" class="gas">▲</button></div>
    </div>
    <div class="fade" id="fade"></div>
    <button class="chip chip-solid hall-skip" id="hallSkip" data-action="skipHall" hidden><span data-i18n="skip"></span> ⏭</button>
    <p class="loading" id="loading" data-i18n="loading" hidden></p>
  </section>

  <!-- ============ VERSION CLASSIQUE ============ -->
  <section id="classic" class="view" hidden aria-label="Portfolio"></section>
</div>
